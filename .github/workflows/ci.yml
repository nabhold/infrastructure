name: Infrastructure CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cp compose/.env.example compose/.env
      - run: docker compose --env-file compose/.env --file compose/compose.yaml config --quiet
